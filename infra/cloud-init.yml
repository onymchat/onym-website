#cloud-config
# Onym droplet bootstrap. Runs once at first boot.
# Provisions Caddy + deploy user + web root + firewall.
#
# Re-running this file requires destroying & recreating the droplet.
# For ad-hoc tweaks (e.g. Caddyfile changes), edit on the box and
# `systemctl reload caddy`.

package_update: true
package_upgrade: false
packages:
  - debian-keyring
  - debian-archive-keyring
  - apt-transport-https
  - curl
  - rsync
  - ufw

users:
  - name: deploy
    groups: [sudo]
    shell: /bin/bash
    sudo: 'ALL=(ALL) NOPASSWD:ALL'
    # Authorized keys are mirrored from /root/.ssh/authorized_keys
    # in runcmd below. DigitalOcean injects the --ssh-keys public
    # keys into root's authorized_keys before runcmd executes.

write_files:
  - path: /etc/caddy/Caddyfile
    owner: root:root
    permissions: '0644'
    content: |
      # Onym site config. TLS auto-provisioned by Caddy via Let's
      # Encrypt as soon as DNS for onym.app points to this droplet.

      # Sibling sites on this droplet (onym.foundation, ...) deploy
      # their own vhost files into sites.d from their own repos; this
      # file never carries their config. A glob import that matches
      # nothing is valid, so this is safe on a fresh droplet too.
      import /etc/caddy/sites.d/*.caddy

      # www is a permanent redirect, not a second copy of the site.
      # Serving both hosts made every page reachable at two URLs;
      # search engines have to guess which one is canonical, and the
      # guess splits ranking signals between them. One host wins.
      www.onym.app {
        redir https://onym.app{uri} 301
      }

      onym.app {
        root * /var/www/onym

        # /architecture is the legacy path (onym.chat had it as a
        # dedicated page). The current site exposes architecture
        # under /how/, with #architecture only as a homepage anchor.
        @arch path /architecture /architecture/
        redir @arch /how/ 301

        try_files {path} {path}.html {path}/
        encode gzip
        file_server

        # HTML must always be revalidated, never served stale from the
        # browser cache. The pages carry a client-side locale redirect
        # keyed on a stored preference; a stale page from an older
        # deploy can disagree with a fresh one and ping-pong the user
        # between / and /ru/. no-cache forces a conditional request
        # (etag/last-modified still make that cheap: 304 when unchanged)
        # so version skew can't happen. Assets (hashed-ish, immutable
        # enough) keep Caddy's default caching.
        @html path_regexp html_or_dir (\.html$|/$)
        header @html Cache-Control "no-cache"

        # iOS OTA install needs the right Content-Types on the
        # manifest.plist + .ipa so itms-services:// can hand off.
        @plist path *.plist
        header @plist Content-Type application/xml
        @ipa path *.ipa
        header @ipa Content-Type application/octet-stream

        # Apple Universal Links: AASA is extensionless, so Caddy
        # won't auto-set a Content-Type. iOS rejects anything other
        # than application/json (silently). Path must be exact;
        # Apple does not follow redirects.
        @aasa path /.well-known/apple-app-site-association
        header @aasa Content-Type application/json
      }

runcmd:
  # 1. Mirror root's authorized_keys -> root@ FIRST so the workflow's
  # SSH wait succeeds in ~30s instead of ~3-5min. DO injects the
  # --ssh-keys public keys into /root/.ssh/authorized_keys before
  # runcmd runs. Doing this before the slow Caddy install matters:
  # cloud-init is still "in progress" until everything below finishes,
  # but SSH is reachable for the workflow's `cloud-init status --wait`
  # poller almost immediately.
  - mkdir -p /home/deploy/.ssh
  - cp /root/.ssh/authorized_keys /home/deploy/.ssh/authorized_keys
  - chown -R deploy:deploy /home/deploy/.ssh
  - chmod 700 /home/deploy/.ssh
  - chmod 600 /home/deploy/.ssh/authorized_keys

  # 2. Web root: deploy-owned, world-readable so caddy user can serve.
  # sites.d holds vhosts owned by sibling-site repos (see Caddyfile import).
  - mkdir -p /etc/caddy/sites.d
  - mkdir -p /var/www/onym
  - chown -R deploy:deploy /var/www/onym
  - chmod 755 /var/www/onym

  # 3. Firewall
  - ufw allow OpenSSH
  - ufw allow http
  - ufw allow https
  - ufw --force enable

  # 4. Caddy from the official Cloudsmith repo (slow -- last)
  - 'curl -1sLf "https://dl.cloudsmith.io/public/caddy/stable/gpg.key" | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg'
  - 'curl -1sLf "https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt" | tee /etc/apt/sources.list.d/caddy-stable.list'
  - apt-get update
  # Pre-create the caddy system user. The Cloudsmith postinst is
  # supposed to do this via adduser, but on some clean Ubuntu 24.04
  # images it silently no-ops, leaving the systemd unit (which
  # specifies User=caddy) failing with status 217/USER. Creating
  # the user before install is idempotent and dodges the issue.
  - getent passwd caddy >/dev/null || useradd --system --home-dir /var/lib/caddy --shell /usr/sbin/nologin --create-home caddy
  - DEBIAN_FRONTEND=noninteractive apt-get install -y caddy
  - systemctl enable --now caddy
